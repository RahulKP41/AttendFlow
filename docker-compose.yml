services:

  mongodb:
    image: mongo:latest
    container_name: attendflow-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - attendflow-network

  backend:
    build:
      context: ./backend

    container_name: attendflow-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    env_file:
      - ./backend/.env

    depends_on:
      - mongodb

    networks:
      - attendflow-network

  frontend:
    build:
      context: ./frontend

    container_name: attendflow-frontend

    restart: unless-stopped

    ports:
      - "80:80"

    depends_on:
      - backend

    networks:
      - attendflow-network

volumes:
  mongodb_data:

networks:
  attendflow-network: